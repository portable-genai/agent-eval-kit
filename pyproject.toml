[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-eval-kit"
version = "0.0.3"
description = "The shared evaluation scaffold for hexagonal service repos: the EvalReport/EvalMetricResult types and their rendering, a run_eval.py --mode smoke|gate CLI scaffold (offline heuristic vs a shared promotion authority), a promotion-gate HTTP client (structured target, registered bundle, results[] parse, POST gate), a not-falsely-green harness that turns 'prove this metric can go red' into a one-liner, reviewed thresholds read from rubric files rather than module constants, comment-tolerant golden-set loading that refuses the vacuous shapes, retrieval-quality scoring (recall@k / precision@k / MRR), the denominator rule that catches a 1.0 wearing a 0.90 label, offline replay of recorded managed-model output, and an offline narrative-quality judge with per-vertical quality floors (deterministic by default, a local model server by opt-in). Pure standard library except the two HTTP clients (httpx) and optional YAML rubric reading (PyYAML), neither of which the package imports."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Ashish Awasthi" }]
keywords = [
  "evaluation", "eval-gate", "model-risk", "llm-eval", "smoke-test",
  "promotion-gate", "not-falsely-green", "hexagonal", "ports-and-adapters",
  "golden-dataset", "rubrics", "retrieval-eval", "llm-judge", "replay",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]

# The report, modes and harness layers are pure stdlib. Only the gate client needs an HTTP
# client, so httpx is the single runtime dependency.
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
# Reading a rubric or a scenario corpus written in YAML. An EXTRA rather than a dependency,
# because a consumer's decision core must not gain a parser for the sake of a loader no domain
# module calls: `rubrics.py` and `datasets.py` import PyYAML inside the one function that needs
# it, and every other format they read (.toml, .json, .jsonl) is standard library.
yaml = ["pyyaml>=6.0"]

# The test/lint toolchain. Ruff is pinned EXACTLY so formatting never drifts across machines.
# respx mocks the gate endpoints so the gate-client contract test never talks to a real service.
# pyyaml is here because the rubric loader's YAML path has to be TESTED even though it is
# optional at runtime; `tests/test_core_purity.py` proves the package still imports without it.
dev = [
  "ruff==0.16.8",
  "mypy>=1.10",
  "pytest>=8.2",
  "respx>=0.21",
  "pyyaml>=6.0",
  "types-PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/portable-genai/agent-eval-kit"
Source = "https://github.com/portable-genai/agent-eval-kit"
Issues = "https://github.com/portable-genai/agent-eval-kit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_eval_kit"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
